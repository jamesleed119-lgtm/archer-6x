<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archer 6x</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #274e13;
        font-family: "Gill Sans", sans-serif;
      }
      .game-embed-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #274e13;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        box-sizing: border-box;
        color: #fff;
        text-align: center;
      }
      .button-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        padding: 20px;
        width: 100%;
        max-width: 550px;
        box-sizing: border-box;
      }
      .logo-text {
        font-size: 2.5rem;
        font-weight: bold;
        color: #fff;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
        padding-bottom: 10px;
      }
      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        width: 100%;
      }
      .c-button {
        min-height: 50px;
        appearance: none;
        border: 2px solid rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        color: #fff;
        padding: 10px 15px;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      .btn-primary { background: #6aa84f; }
      .btn-alt { background: #073763; }
      .c-button:hover { transform: translateY(-2px); }
      .c-button:disabled { background: #555; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="gameContainer" class="game-embed-container">
      <div id="buttonWrapper" class="button-wrapper">
        <div class="logo-text">Classroom</div>
        <div class="button-grid">
          <button id="playPrimaryInline" class="c-button btn-primary">Play Inline</button>
          <button id="playPrimaryFullscreen" class="c-button btn-primary">Fullscreen</button>
          <button id="playAltInline" class="c-button btn-alt">Alt Inline</button>
          <button id="playAltFullscreen" class="c-button btn-alt">Alt Fullscreen</button>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
